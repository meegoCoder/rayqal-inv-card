<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raiqal Hareez's Birthday Party</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e01b24;--red-d:#9c0f17;--blue:#1c3f9e;--navy:#0b1437;--gold:#ffe14d;--line:rgba(255,255,255,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:#fff;font:400 16px/1.55 'Poppins',system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto}
.display{font-family:'Bangers',Impact,sans-serif;letter-spacing:.04em;font-weight:400}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0,#2a4fc4,var(--blue) 35%,var(--navy))}
.bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}

/* Cover */
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
background:linear-gradient(160deg,var(--red),var(--red-d));transition:transform .9s cubic-bezier(.7,0,.2,1)}
#cover.open{transform:translateY(-100%)}
#cover>svg.web{position:absolute;inset:0;width:100%;height:100%;opacity:.22}
#cover>*:not(.web){position:relative}
.eyebrow{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.cover-name{font-size:clamp(3rem,16vw,5rem);line-height:.95;text-shadow:4px 4px 0 var(--navy);margin:.5rem 0 .3rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;font:600 .95rem 'Poppins',sans-serif;padding:.85rem 1.5rem;border-radius:999px;background:#fff;color:var(--red);text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 #6e0910}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 #0a1c52}
.btn svg{width:18px;height:18px}
.swing{position:absolute!important;top:0;left:50%;margin-left:-20px;transform-origin:top center;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg)}}

/* Sections */
section{padding:52px 22px;text-align:center}
.badge{display:inline-block;background:var(--red);padding:.15rem 1.1rem;transform:rotate(-3deg);font-size:1.7rem;border:3px solid #fff;box-shadow:5px 5px 0 var(--navy)}
h1{font-size:clamp(3.2rem,17vw,5.4rem);line-height:.95;margin:.8rem 0 .2rem;text-shadow:4px 4px 0 var(--red)}
h2{font-size:2.1rem;text-shadow:3px 3px 0 var(--red);margin-bottom:1.1rem}
.sub{opacity:.85;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;margin-top:1.1rem}

/* Image placeholders */
.ph{position:relative;pointer-events:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.35rem;overflow:hidden;font-size:.78rem;text-align:center;
background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 10px,rgba(255,255,255,.03) 10px 20px);border:3px dashed rgba(255,255,255,.6)}
.ph svg{width:30px;height:30px;opacity:.85}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has{border-style:solid;border-color:#fff}
.ph.has>span,.ph.has>svg{display:none}
.ph img:not([src]),.ph img[src=""]{display:none}
.ph img{pointer-events:none;-webkit-user-drag:none}
.ph video{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;pointer-events:auto}
.ph.vid video{display:block}
.ph.vid img{display:none}
.hero-ph{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;margin:1.6rem auto 0;border-color:var(--red);box-shadow:0 0 0 6px #fff,0 0 0 12px var(--red)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal .ph{aspect-ratio:3/4;border-radius:18px}
.gal .ph:first-child{transform:rotate(-2deg)}.gal .ph:last-child{transform:rotate(2deg)}
.media-ph{aspect-ratio:16/10;width:100%;border-radius:18px;margin-top:1.1rem}

/* Comic animation */
.stage{position:relative;height:230px;margin:0 -22px;overflow:hidden;border-block:4px solid #fff;background:linear-gradient(#ff5a4d,var(--red) 55%,#8f0d14)}
.stage .dots{position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 18%,transparent 20%) 0 0/14px 14px}
.stage .city{position:absolute;bottom:0;left:0;width:100%;height:110px}
.swinger{position:absolute;top:-6px;left:0;width:100%;height:190px}
.pend{transform-box:view-box;transform-origin:240px 0;animation:pend 2.4s ease-in-out infinite}
@keyframes pend{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
.burst{position:absolute;font-size:2rem;color:var(--gold);-webkit-text-stroke:2px var(--navy);text-shadow:3px 3px 0 var(--navy);opacity:0;animation:pop 4.8s infinite}
.b1{left:8%;top:52%;--r:-12deg}.b2{right:8%;top:30%;--r:10deg;animation-delay:1.6s}.b3{left:36%;top:70%;--r:-4deg;animation-delay:3.2s}
@keyframes pop{0%,8%{opacity:0;transform:scale(.2) rotate(var(--r))}14%{opacity:1;transform:scale(1.25) rotate(var(--r))}22%,34%{opacity:1;transform:scale(1) rotate(var(--r))}42%,100%{opacity:0;transform:scale(.6) rotate(var(--r))}}
.spidey{position:absolute;right:14%;top:0;animation:drop 3.6s ease-in-out infinite}
@keyframes drop{50%{transform:translateY(26px)}}

/* Countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;padding:.7rem 0}
.count b{display:block;font:400 2rem/1 'Bangers',Impact,sans-serif;letter-spacing:.04em}
.count small{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;opacity:.8}

/* Details */
.card{background:#fff;color:var(--navy);border-radius:22px;padding:.8rem 1.4rem;text-align:left;box-shadow:8px 8px 0 var(--red)}
.row{display:flex;gap:14px;align-items:center;padding:.85rem 0;border-bottom:2px dashed #cfd6ee}
.row:last-child{border:0}
.row .i{flex:0 0 44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
.row .i svg{width:22px;height:22px}
.row small{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#5b6794}
.row strong{font-weight:600;font-size:1.02rem;line-height:1.3;display:block}
.note{margin-top:1.5rem;background:linear-gradient(90deg,var(--red),#b5121a);border:2px solid #fff;border-radius:16px;padding:1rem 1.2rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer{padding:30px 22px 60px;text-align:center;font-size:.85rem;opacity:.85}

/* RSVP form */
.form{padding:1.5rem 1.4rem;display:flex;flex-direction:column;gap:.35rem}
.form label,.form .lbl{font-weight:600;font-size:.9rem;color:#2b3350;margin-top:.7rem}
.form input[type=text],.form input[type=tel],.form input[type=number]{width:100%;font:400 1rem 'Poppins',system-ui,sans-serif;color:var(--navy);background:#fff;border:1.5px solid #dfe4f3;border-radius:12px;padding:.8rem 1rem;outline:0;transition:border-color .2s,box-shadow .2s}
.form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,63,158,.15)}
.form input:disabled{background:#f1f3fa;color:#8b93b3}
.form input[readonly]{background:#f1f3fa;color:#5b6794;cursor:default}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split label{display:block}
.form .help{color:#6a7399;font-size:.78rem}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{position:relative;margin:0;font-weight:500}
.choice input{position:absolute;opacity:0;inset:0}
.choice span{display:block;text-align:center;padding:.75rem .5rem;border:1.5px solid #dfe4f3;border-radius:12px;font-size:.92rem;transition:.2s}
.choice input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.choice input:focus-visible+span{box-shadow:0 0 0 3px rgba(28,63,158,.25)}
.form .btn{justify-content:center;margin-top:1.1rem;width:100%}
.form .btn:disabled{opacity:.6;cursor:default;transform:none}
#msg{min-height:1.3em;margin-top:.5rem;font-size:.88rem;text-align:center;color:#1c7a3d}
#msg.err{color:#c4161f}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.swing,.pend,.spidey,.burst{animation:none}.burst{opacity:1}.rv{opacity:1;transform:none}}
</style>
</head>

<main class="wrap">

    hero:     "https://i.postimg.cc/J4Pt0C0J/Whats-App-Image-2026-10-08-at-15-52-21.jpg",   // Photo 1 - main round portrait
    media:    "invite.mp4",   // Photo / GIF 4 - wide slot under the animation
    gallery1: "https://i.postimg.cc/T2kXWdj2/family1-uclja-auntylynn.jpg",   // Photo 2
    gallery2: "https://i.postimg.cc/Y0PVDS8B/family2-ucl-ja-auntylynn.jpg"    // Photo 3
  }
};
/* ===================== END OF EDITABLE AREA ===================== */

(function(){
  var $=function(i){return document.getElementById(i)};
  document.title=INVITE.pageTitle;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=INVITE[el.getAttribute('data-t')]||''});

  // Open cover
  $('openBtn').onclick=function(){var c=$('cover');c.classList.add('open');setTimeout(function(){c.style.display='none'},950)};

  // Load images from INVITE.images, hide placeholder text once loaded
  document.querySelectorAll('[data-slot]').forEach(function(box){
    var key=box.getAttribute('data-slot'),im=box.querySelector('img'),src=INVITE.images[key];
    if(key==='media'&&INVITE.video&&INVITE.video.src){
      var v=box.querySelector('video');
      v.setAttribute('src',INVITE.video.src);
      if(INVITE.video.poster)v.setAttribute('poster',INVITE.video.poster);
      box.classList.add('vid','has');return;
    }
    if(src)im.setAttribute('src',src);
    var ok=function(){box.classList.add('has')};
    if(im.getAttribute('src')){ if(im.complete&&im.naturalWidth)ok(); else im.addEventListener('load',ok); }
  });

  // Countdown
  var target=new Date(INVITE.startISO).getTime(),p=function(n){return String(n).padStart(2,'0')};
  function tick(){var x=Math.max(0,target-Date.now());
    $('d').textContent=p(Math.floor(x/864e5));$('h').textContent=p(Math.floor(x%864e5/36e5));
    $('m').textContent=p(Math.floor(x%36e5/6e4));$('s').textContent=p(Math.floor(x%6e4/1e3));}
  tick();setInterval(tick,1000);

  // Buttons
  $('cal').href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(INVITE.pageTitle)+"&dates="+INVITE.calStart+"/"+INVITE.calEnd+"&ctz="+INVITE.timezone+"&location="+encodeURIComponent(INVITE.venue);
  $('map').href=INVITE.mapUrl||"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(INVITE.venue);

  // RSVP form
  var paxEl=$('pax'),form=$('rsvpForm'),msg=$('msg'),send=$('send'),extra=$('extra'),adult=$('adult'),kids=$('kids'),DEMO='rsvp_demo_total';
  function setPax(n){paxEl.textContent=n}
  function say(t,err){msg.textContent=t;msg.className=err?'err':''}
  function loadTotal(){
    if(INVITE.rsvpEndpoint){fetch(INVITE.rsvpEndpoint).then(function(r){return r.json()}).then(function(j){setPax(j.total)}).catch(function(){})}
    else{try{setPax(+localStorage.getItem(DEMO)||0)}catch(e){}}
  }
  loadTotal();
  form.querySelectorAll('input[name=hadir]').forEach(function(r){r.addEventListener('change',function(){
    var no=form.hadir.value==='Tidak';
    adult.disabled=kids.disabled=extra.disabled=no;
    if(no){adult.value=kids.value=extra.value=0}})});
  function cnt(el){return Math.max(0,Math.min(20,parseInt(el.value,10)||0))}
  function sync(){extra.value=cnt(adult)+cnt(kids)}
  adult.addEventListener('input',sync);kids.addEventListener('input',sync);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var nama=form.nama.value.trim(),tel=form.tel.value.trim(),hadir=form.hadir.value,
        a=hadir==='Ya'?cnt(adult):0,k=hadir==='Ya'?cnt(kids):0,n=a+k;
    if(!nama){say('Sila isi nama penuh.',1);form.nama.focus();return}
    if(!/^\+?[0-9\s-]{9,15}$/.test(tel)){say('Sila masukkan nombor telefon yang sah.',1);form.tel.focus();return}
    if(n>20){say('Maksimum 20 tambahan tetamu.',1);return}
    var pax=hadir==='Ya'?1+n:0;
    send.disabled=true;say('Menghantar...');
    function done(total){
      setPax(total);say((hadir==='Ya'?INVITE.thanksYes:INVITE.thanksNo).replace('{nama}',nama));
      send.textContent='Telah dihantar';form.querySelectorAll('input').forEach(function(i){i.disabled=true});
    }
    if(INVITE.rsvpEndpoint){
      fetch(INVITE.rsvpEndpoint,{method:'POST',body:JSON.stringify({nama:nama,telefon:tel,hadir:hadir,extra:n,adult:a,kids:k})})
        .then(function(r){return r.json()}).then(function(j){done(j.total)})
        .catch(function(){send.disabled=false;say('Maaf, penghantaran gagal. Sila cuba lagi.',1)});
    }else{
      var t=0;try{t=(+localStorage.getItem(DEMO)||0)+pax;localStorage.setItem(DEMO,t)}catch(e){t=(+paxEl.textContent||0)+pax}
      done(t);
    }
  });

  // Scroll reveal
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
